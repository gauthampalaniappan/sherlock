# Builds Sherlock's Linux packages (.rpm for Fedora, .deb for Debian/Ubuntu).
#
# Two ways to make a release (both end in a *draft* you review, then Publish):
# - Actions tab -> Release -> Run workflow, tick "Create draft release".
#   The tag (v<version>) is created by GitHub when you press Publish.
# - Or push a tag like v1.2.3 yourself.
# Running it without the tick only builds and launch-tests the packages;
# they appear as downloadable artifacts on that run.
#
# Linux only: Sherlock searches .desktop launchers and Linux file indexes
# (plocate, Tracker), which do not exist on Windows or macOS.
#
# The version comes from __version__ in sherlock/__init__.py, and
# data/sherlock-search.metainfo.xml needs a <release> line for that version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create draft release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version and decide what to do
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_RELEASE: ${{ inputs.release }}
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sherlock/__init__.py)"
          tag="v$version"
          if ! grep -q "<release version=\"$version\"" data/sherlock-search.metainfo.xml; then
            echo "::error::Add <release version=\"$version\" date=\"YYYY-MM-DD\"/> to data/sherlock-search.metainfo.xml"
            exit 1
          fi
          release=false
          skip=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in sherlock/__init__.py"
              exit 1
            fi
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Publishing a draft creates the tag, which lands here; already done.
              echo "::notice::Release $tag already exists; nothing to build."
              skip=true
            else
              release=true
            fi
          elif [[ "$MAKE_RELEASE" == "true" ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error::$tag is already released. Bump __version__ in sherlock/__init__.py (and add a <release> line to data/sherlock-search.metainfo.xml) first."
              exit 1
            fi
            release=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, release=$release, skip=$skip"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m py_compile sherlock/*.py
          python -m unittest discover -s tests -v

  fedora:
    name: Linux (Fedora .rpm)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf -y install rpm-build desktop-file-utils python3 python3-devel tar \
            xorg-x11-server-Xvfb mesa-dri-drivers dejavu-sans-fonts

      - uses: actions/checkout@v7

      - name: Build RPM
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/linux/build-packages.sh rpm

      - name: Install the RPM and launch it
        run: |
          dnf -y install ./release/*.rpm
          rpm -qi sherlock-search
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          export DISPLAY=:99 GDK_BACKEND=x11 GSK_RENDERER=cairo
          sleep 2
          # Sherlock stays open until closed, so "still running after 10 s" is a pass.
          rc=0
          timeout 10 sherlock-search > out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$rc" -ne 124 ] || grep -q Traceback out.txt; then
            echo "::error::sherlock-search exited early (code $rc)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sherlock-fedora
          path: release/*.rpm
          if-no-files-found: error

  ubuntu:
    name: Linux (Debian/Ubuntu .deb)
    needs: version
    if: needs.version.outputs.skip != 'true'
    # Built and tested on Ubuntu 24.04 LTS, the oldest system the .deb targets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build .deb
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: packaging/linux/build-packages.sh deb

      - name: Install the .deb and launch it
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./release/*.deb xvfb
          dpkg -s sherlock-search | head -3
          export GSK_RENDERER=cairo
          rc=0
          timeout 10 xvfb-run -a sherlock-search > out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$rc" -ne 124 ] || grep -q Traceback out.txt; then
            echo "::error::sherlock-search exited early (code $rc)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sherlock-debian
          path: release/*.deb
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    if: needs.version.outputs.release == 'true'
    needs: [version, fedora, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Re-running replaces an earlier unpublished draft for this version.
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
          cat > notes.md <<EOF
          ## Install

          | System | Download |
          | --- | --- |
          | Fedora | \`sherlock-search-$VERSION-1.*.noarch.rpm\` — \`sudo dnf install ./sherlock-search-*.rpm\` |
          | Debian 13 / Ubuntu 24.04+ | \`sherlock-search_$VERSION-1_all.deb\` — \`sudo apt install ./sherlock-search_*.deb\` |

          Then open **Sherlock** from the app grid, or run \`sherlock-search\`.
          The package and command are named \`sherlock-search\` because Debian and
          Ubuntu already have an unrelated \`sherlock\` package.

          For fast file search also install \`plocate\` and run \`sudo updatedb\` once.
          EOF
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Sherlock $VERSION" \
            --notes-file notes.md \
            --generate-notes
